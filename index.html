<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兼職簽到表</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; }
.container { max-width: 480px; margin: 0 auto; }
h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 1.5rem; }

.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

.info-row { display: flex; align-items: center; margin-bottom: 14px; }
.info-row:last-of-type { margin-bottom: 0; }
.info-row.location-row { margin-bottom: 0; }
label { color: #666; font-size: 0.85rem; width: 70px; flex-shrink: 0; }
.value { color: #333; font-size: 1rem; flex: 1; }
.value.highlight { color: #007AFF; font-weight: 600; }

.btn { width: 100%; padding: 16px; font-size: 1.1rem; border: none; border-radius: 10px; cursor: pointer; margin-top: 16px; transition: transform 0.1s, opacity 0.2s; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-sign { background: #34C759; color: #fff; }
.btn-sign:hover:not(:disabled) { background: #2db84d; }

.btn-export { background: #007AFF; color: #fff; margin-top: 10px; }
.btn-export:hover { background: #0064d9; }

.btn-clear { background: #ff3b30; color: #fff; margin-top: 10px; }
.btn-clear:hover { background: #d63028; }

#records { margin-top: 20px; }
#records h2 { font-size: 1rem; color: #333; margin-bottom: 10px; }
.record-item { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-size: 0.9rem; }
.record-item .r-name { font-weight: 600; color: #333; margin-bottom: 4px; }
.record-item .r-detail { color: #666; font-size: 0.8rem; }
.record-item .r-note { color: #888; font-size: 0.8rem; font-style: italic; margin-top: 2px; }

.status { text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.9rem; display: none; }
.status.success { background: #d4edda; color: #155724; display: block; }
.status.error { background: #f8d7da; color: #721c24; display: block; }
.status.loading { background: #fff3cd; color: #856404; display: block; }

#map { width: 100%; height: 120px; border-radius: 8px; margin-top: 8px; display: none; background: #eee; }

#adminPanel { display: none; margin-top: 20px; background: #fff; border-radius: 12px; padding: 20px; }
#adminPanel h2 { font-size: 1rem; color: #333; margin-bottom: 10px; }
#adminList { max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 兼職簽到表</h1>

  <div class="card">
    <div class="info-row">
      <label>姓名</label>
      <input type="text" id="name" class="value" placeholder="請輸入姓名" autocomplete="off">
    </div>
    <div class="info-row">
      <label>打卡時間</label>
      <span id="time" class="value highlight">載入中...</span>
    </div>
    <div class="info-row location-row">
      <label>打卡地點</label>
      <span id="address" class="value">定位中...</span>
      <button onclick="retryLocation()" style="margin-left:8px;padding:4px 10px;font-size:0.75rem;background:#007AFF;color:#fff;border:none;border-radius:6px;cursor:pointer;">重試</button>
    </div>
    <div id="locationHelp" style="display:none;background:#fff3cd;border-radius:8px;padding:12px;margin-top:8px;font-size:0.85rem;color:#856404;">
      <strong>📍 定位失敗</strong><br><br>
      <strong>請確認以下設定：</strong><br><br>
      <strong>🔵 Chrome 電腦版：</strong><br>
      1. 撳擊位址欄左側的 🔒 或 🌐 圖標<br>
      2. 選擇「網站設定」<br>
      3. 位置 → 改為「允許」<br>
      4. 重新整理頁面<br><br>
      <strong>🟢 Safari Mac 版：</strong><br>
      1. 右上角 Safari → 偏好設定 → 網站<br>
      2. 選擇「位置」<br>
      3. 找到此網站 → 允許<br>
      4. 重新整理頁面<br><br>
      <strong>📱 iPhone / Android：</strong><br>
      1. 確保瀏覽器有取位置權限（設定 → 應用程式 → 瀏覽器 → 位置）<br>
      2. 重新整理頁面後點擊「允許」
    </div>
    <div id="map"></div>
  </div>

  <div class="card">
    <div class="info-row">
      <label>備注</label>
      <input type="text" id="note" class="value" placeholder="選填" autocomplete="off">
    </div>
    <button class="btn btn-sign" id="signBtn" onclick="signIn()">✅ 打卡簽到</button>
    <div id="status" class="status"></div>
  </div>

  <button class="btn btn-export" onclick="exportCSV()">📥 匯出 CSV</button>
  <button class="btn btn-clear" onclick="clearRecords()">🗑️ 清除記錄</button>

  <div id="records"></div>

  <div id="adminPanel">
    <h2>📊 所有簽到記錄（來自雲端）</h2>
    <button onclick="loadCloudRecords()" style="padding:8px 16px;background:#007AFF;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-bottom:10px;">🔄 刷新</button>
    <div id="adminList"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBw38H4pu7C5sLmI73VWieXB8veDQqKANU",
    authDomain: "signin-b4b1c.firebaseapp.com",
    databaseURL: "https://signin-b4b1c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "signin-b4b1c",
    storageBucket: "signin-b4b1c.firebasestorage.app",
    messagingSenderId: "114524535002",
    appId: "1:114524535002:web:9f993c70dc63f7e4d00de3",
    measurementId: "G-9THKBY59HW"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 初始化時間
  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('time').textContent = timeStr;
  }
  updateTime();
  setInterval(updateTime, 1000);

  // 自動定位
  function getLocation() {
    document.getElementById('address').textContent = '定位中...';
    document.getElementById('locationHelp').style.display = 'none';

    if (!window.isSecureContext) {
      window.currentAddress = '需要 HTTPS';
      document.getElementById('address').textContent = '⚠️ 需要 HTTPS';
      document.getElementById('locationHelp').innerHTML = '<strong>⚠️ 需要安全連線</strong><br>定位功能需要 HTTPS 連線。<br>請確認網址以 https:// 開頭。';
      document.getElementById('locationHelp').style.display = 'block';
      return;
    }

    if (!navigator.geolocation) {
      window.currentAddress = '不支援定位';
      document.getElementById('address').textContent = currentAddress;
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        window.currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        document.getElementById('address').textContent = `📍 ${currentPosition.lat.toFixed(6)}, ${currentPosition.lng.toFixed(6)}`;
        document.getElementById('locationHelp').style.display = 'none';
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${currentPosition.lat}&lon=${currentPosition.lng}&format=json&accept-language=zh`)
          .then(r => r.json())
          .then(data => {
            const addr = data.address;
            const parts = [];
            if (addr.city || addr.town || addr.village) parts.push(addr.city || addr.town || addr.village);
            if (addr.suburb) parts.push(addr.suburb);
            if (addr.road) parts.push(addr.road);
            if (parts.length > 0) {
              window.currentAddress = parts.join('');
            } else if (data.display_name) {
              window.currentAddress = data.display_name.split(',')[0];
            }
            document.getElementById('address').textContent = '📍 ' + window.currentAddress;
          })
          .catch(() => {
            document.getElementById('address').textContent = '📍 ' + window.currentAddress;
          });
      },
      (error) => {
        let errorMsg = '定位失敗';
        switch(error.code) {
          case 1: errorMsg = '位置權限被拒絕'; break;
          case 2: errorMsg = '位置無法取得'; break;
          case 3: errorMsg = '定位超時'; break;
        }
        window.currentAddress = errorMsg;
        document.getElementById('address').textContent = '⚠️ ' + errorMsg;
        document.getElementById('locationHelp').style.display = 'block';
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  function retryLocation() { getLocation(); }
  getLocation();

  // 讀取本地記錄
  function loadRecords() {
    const data = JSON.parse(localStorage.getItem('signRecords') || '[]');
    const container = document.getElementById('records');
    if (data.length === 0) {
      container.innerHTML = '<h2>📌 簽到記錄</h2><p style="color:#999;text-align:center;padding:20px;">暫無記錄</p>';
      return;
    }
    container.innerHTML = '<h2>📌 簽到記錄（共 ' + data.length + ' 筆）</h2>' +
      data.map((r, i) => `
        <div class="record-item">
          <div class="r-name">${i+1}. ${r.name}</div>
          <div class="r-detail">🕐 ${r.time} | ${r.address}</div>
          ${r.note ? '<div class="r-note">📝 ' + r.note + '</div>' : ''}
        </div>
      `).join('');
  }
  loadRecords();

  // 打卡
  function signIn() {
    const name = document.getElementById('name').value.trim();
    const note = document.getElementById('note').value.trim();
    const status = document.getElementById('status');

    if (!name) {
      status.className = 'status error';
      status.textContent = '⚠️ 請輸入姓名';
      status.style.display = 'block';
      setTimeout(() => { status.className = 'status'; status.style.display = 'none'; }, 2000);
      return;
    }

    const time = document.getElementById('time').textContent;
    const record = { name, time, address: window.currentAddress, note, timestamp: new Date().toISOString() };

    // 存本地
    const localData = JSON.parse(localStorage.getItem('signRecords') || '[]');
    localData.unshift(record);
    localStorage.setItem('signRecords', JSON.stringify(localData));

    document.getElementById('name').value = '';
    document.getElementById('note').value = '';

    // 發到 Firebase Realtime Database
    status.className = 'status loading';
    status.textContent = '📤 儲存中...';
    status.style.display = 'block';

    db.ref('signin').push(record)
      .then(() => {
        status.className = 'status success';
        status.textContent = '✅ 簽到成功！';
      })
      .catch((e) => {
        console.error('Firebase error:', e);
        status.className = 'status error';
        status.textContent = '❌ 儲存失敗：' + e.message;
      });

    setTimeout(() => { status.className = 'status'; status.style.display = 'none'; status.textContent = ''; }, 3000);
    loadRecords();
  }

  // 匯出CSV
  function exportCSV() {
    const data = JSON.parse(localStorage.getItem('signRecords') || '[]');
    if (data.length === 0) {
      alert('暫無記錄可匯出');
      return;
    }
    const csv = '\uFEFF姓名,打卡時間,打卡地點,備注\n' +
      data.map(r => `"${r.name}","${r.time}","${r.address}","${r.note || ''}"`).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '簽到記錄_' + new Date().toLocaleDateString('zh-TW').replace(/\//g, '-') + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  // 清除記錄
  function clearRecords() {
    const pw = prompt('請輸入密碼以清除所有記錄：');
    if (pw === '1119') {
      if (confirm('⚠️ 確定要清除所有簽到記錄嗎？此操作無法恢復！')) {
        localStorage.removeItem('signRecords');
        loadRecords();
        alert('✅ 記錄已清除');
      }
    } else if (pw !== null) {
      alert('❌ 密碼錯誤');
    }
  }

  // 載入雲端記錄（管理員用）
  function loadCloudRecords() {
    const container = document.getElementById('adminList');
    container.innerHTML = '<p style="color:#856404;text-align:center;">載入中...</p>';

    db.ref('signin').once('value')
      .then((snapshot) => {
        if (!snapshot.exists()) {
          container.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">暫無記錄</p>';
          return;
        }
        const records = [];
        snapshot.forEach(child => {
          records.push(child.val());
        });
        records.reverse();
        container.innerHTML = records.map((r, i) => {
          return `<div class="record-item">
            <div class="r-name">${i+1}. ${r.name}</div>
            <div class="r-detail">🕐 ${r.time} | ${r.address}</div>
            ${r.note ? '<div class="r-note">📝 ' + r.note + '</div>' : ''}
          </div>`;
        }).join('');
      })
      .catch((e) => {
        console.error(e);
        container.innerHTML = '<p style="color:red;text-align:center;">載入失敗: ' + e.message + '</p>';
      });
  }

  // 密碼解鎖管理員面板
  function showAdmin() {
    const pw = prompt('請輸入管理員密碼：');
    if (pw === '1119') {
      document.getElementById('adminPanel').style.display = 'block';
      loadCloudRecords();
    }
  }

  // 3秒後顯示admin面板入口
  setTimeout(() => {
    const hint = document.createElement('div');
    hint.style.cssText = 'text-align:center;margin-top:20px;';
    hint.innerHTML = '<a href="javascript:void(0)" onclick="showAdmin()" style="color:#999;font-size:0.75rem;text-decoration:none;">管理員</a>';
    document.querySelector('.container').appendChild(hint);
  }, 3000);
</script>
</body>
</html>
